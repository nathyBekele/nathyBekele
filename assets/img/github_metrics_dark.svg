<svg
  width="467"
  height="195"
  viewBox="0 0 467 195"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="descId"
>
  <title id="titleId">Repositories &amp; Traffic, Rank: A</title>
  <desc id="descId">Total Repositories: 26, Total Repo Visits: 193, Total Git Clones: 831, Total Forks: 4, Unique Cloners: 404</desc>
  <style>
    .header {
      font: 700 21px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #ffffff;
      animation: fadeInAnimation 0.8s ease-in-out forwards;
    }
    @supports(-moz-appearance: auto) {
      .header { font-size: 19px; }
    }
    
    .stat {
      font: 600 16.5px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif;
      fill: #e6edf3;
    }
    @supports(-moz-appearance: auto) {
      .stat { font-size: 15.5px; }
    }
    .stagger {
      opacity: 0;
      animation: fadeInAnimation 0.3s ease-in-out forwards;
    }
    .rank-text {
      font: 800 29px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #ffffff;
      animation: scaleInAnimation 0.3s ease-in-out forwards;
    }
    .bold { font-weight: 700 }
    .icon {
      fill: #79ff97;
      display: block;
    }

    .rank-circle-rim {
      stroke: #fff;
      fill: none;
      stroke-width: 6;
      opacity: 0.2;
    }
    .rank-circle {
      stroke: #fff;
      stroke-dasharray: 250;
      fill: none;
      stroke-width: 6;
      stroke-linecap: round;
      opacity: 0.8;
      transform-origin: -10px 8px;
      transform: rotate(-90deg);
      animation: rankAnimation 1s forwards ease-in-out;
    }
    
    @keyframes rankAnimation {
      from {
        stroke-dashoffset: 251.32;
      }
      to {
        stroke-dashoffset: 68.5;
      }
    }

    @keyframes scaleInAnimation {
      from {
        transform: translate(-5px, 5px) scale(0);
      }
      to {
        transform: translate(-5px, 5px) scale(1);
      }
    }
    @keyframes fadeInAnimation {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
  </style>

  <rect
    data-testid="card-bg"
    class="card-bg"
    x="0.5"
    y="0.5"
    rx="4.5"
    height="194"
    stroke="#3d444d"
    width="466"
    fill="#151515"
    stroke-opacity="1"
  />

  <g data-testid="card-title" transform="translate(25, 34)">
    <text x="0" y="0" class="header" data-testid="header">Repositories &amp; Traffic</text>
  </g>

  <g data-testid="main-card-body" transform="translate(0, 52)">
    <g data-testid="rank-circle" transform="translate(390.5, 48)">
      <circle class="rank-circle-rim" cx="-10" cy="8" r="40" />
      <circle class="rank-circle" cx="-10" cy="8" r="40" />
      <g class="rank-text">
        <text x="-5" y="3" alignment-baseline="central" dominant-baseline="central" text-anchor="middle" data-testid="level-rank-icon">
          A
        </text>
      </g>
    </g>

    <svg x="0" y="0">
      <!-- Row 1: Total Repositories -->
      <g transform="translate(0, 0)">
        <g class="stagger" style="animation-delay: 450ms" transform="translate(25, 0)">
          <svg data-testid="icon" class="icon" viewBox="0 0 16 16" version="1.1" width="18" height="18" y="-1">
            <path fill-rule="evenodd" d="M2 2.5A2.5 2.5 0 014.5 0h8.75a.75.75 0 01.75.75v12.5a.75.75 0 01-.75.75h-2.5a.75.75 0 110-1.5h1.75v-2h-8a1 1 0 00-.714 1.7.75.75 0 01-1.072 1.05A2.495 2.495 0 012 11.5v-9zm10.5-1h-8a1 1 0 00-1 1v6.708A2.486 2.486 0 014.5 9h8V1.5z"/>
          </svg>
          <text class="stat bold" x="27" y="13.5">Total Repositories:</text>
          <text class="stat bold" x="226" y="13.5">26</text>
        </g>
      </g>

      <!-- Row 2: Total Repo Visits -->
      <g transform="translate(0, 24.5)">
        <g class="stagger" style="animation-delay: 600ms" transform="translate(25, 0)">
          <svg data-testid="icon" class="icon" viewBox="0 0 16 16" version="1.1" width="18" height="18" y="-1">
            <path d="M1.679 7.932c.412-.621 1.242-1.75 2.366-2.717C5.175 4.242 6.527 3.5 8 3.5c1.473 0 2.824.742 3.955 1.715 1.124.967 1.954 2.096 2.366 2.717a.119.119 0 0 1 0 .136c-.412.621-1.242 1.75-2.366 2.717C10.825 11.758 9.473 12.5 8 12.5c-1.473 0-2.824-.742-3.955-1.715C2.92 9.818 2.09 8.69 1.679 8.068a.119.119 0 0 1 0-.136zM8 2c-1.981 0-3.67.992-4.933 2.078C1.797 5.169.88 6.423.43 7.1a1.619 1.619 0 0 0 0 1.8c.45.678 1.367 1.931 2.637 3.022C4.33 13.008 6.019 14 8 14c1.981 0 3.67-.992 4.933-2.078 1.27-1.091 2.187-2.345 2.637-3.023a1.619 1.619 0 0 0 0-1.799c-.45-.678-1.367-1.931-2.637-3.022C11.67 2.992 9.981 2 8 2zm0 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/>
          </svg>
          <text class="stat bold" x="27" y="13.5">Total Repo Visits:</text>
          <text class="stat bold" x="226" y="13.5">193</text>
        </g>
      </g>

      <!-- Row 3: Total Git Clones -->
      <g transform="translate(0, 49)">
        <g class="stagger" style="animation-delay: 750ms" transform="translate(25, 0)">
          <svg data-testid="icon" class="icon" viewBox="0 0 16 16" version="1.1" width="18" height="18" y="-1">
            <path fill-rule="evenodd" d="M7.47 10.78a.75.75 0 001.06 0l3.75-3.75a.75.75 0 00-1.06-1.06L8.75 8.44V1.75a.75.75 0 00-1.5 0v6.69L4.78 5.97a.75.75 0 00-1.06 1.06l3.75 3.75zM3.75 13a.75.75 0 000 1.5h8.5a.75.75 0 000-1.5h-8.5z"/>
          </svg>
          <text class="stat bold" x="27" y="13.5">Total Git Clones:</text>
          <text class="stat bold" x="226" y="13.5">831</text>
        </g>
      </g>

      <!-- Row 4: Total Forks -->
      <g transform="translate(0, 73.5)">
        <g class="stagger" style="animation-delay: 900ms" transform="translate(25, 0)">
          <svg data-testid="icon" class="icon" viewBox="0 0 16 16" version="1.1" width="18" height="18" y="-1">
            <path fill-rule="evenodd" d="M5 3.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm0 2.122a2.25 2.25 0 10-1.5 0v.878A2.25 2.25 0 005.75 8.5h4.5A2.25 2.25 0 0012.5 6.25v-.878a2.25 2.25 0 10-1.5 0v.878a.75.75 0 01-.75.75h-4.5A.75.75 0 015 6.25v-.878zm3.75 7.378a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm.75-2.122v-.878a2.25 2.25 0 00-1.5 0v.878a2.25 2.25 0 101.5 0z"/>
          </svg>
          <text class="stat bold" x="27" y="13.5">Total Forks:</text>
          <text class="stat bold" x="226" y="13.5">4</text>
        </g>
      </g>

      <!-- Row 5: Unique Cloners -->
      <g transform="translate(0, 98)">
        <g class="stagger" style="animation-delay: 1050ms" transform="translate(25, 0)">
          <svg data-testid="icon" class="icon" viewBox="0 0 16 16" version="1.1" width="18" height="18" y="-1">
            <path fill-rule="evenodd" d="M5.5 3.5a2 2 0 100 4 2 2 0 000-4zM2 5.5a3.5 3.5 0 117 0 3.5 3.5 0 01-7 0zm8 0a2 2 0 100 4 2 2 0 000-4zM8.5 2a3.5 3.5 0 117 0 3.5 3.5 0 01-7 0zm-7 11.25c0-1.795 1.455-3.25 3.25-3.25h1.5a3.25 3.25 0 013.25 3.25v.5a.75.75 0 01-1.5 0v-.5a1.75 1.75 0 00-1.75-1.75h-1.5A1.75 1.75 0 003 13.25v.5a.75.75 0 01-1.5 0v-.5zm10.5 0c0-1.795 1.455-3.25 3.25-3.25h.5a3.25 3.25 0 013.25 3.25v.5a.75.75 0 01-1.5 0v-.5a1.75 1.75 0 00-1.75-1.75h-.5a1.75 1.75 0 00-1.75 1.75v.5a.75.75 0 01-1.5 0v-.5z"/>
          </svg>
          <text class="stat bold" x="27" y="13.5">Unique Cloners:</text>
          <text class="stat bold" x="226" y="13.5">404</text>
        </g>
      </g>
    </svg>
  </g>
</svg>
